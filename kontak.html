<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak - Vanguard Web Works</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .nav { mix-blend-mode: normal; background: var(--black); color: var(--white); padding: 12px 40px;}
    .page-wrapper { padding-top: 130px; padding-bottom: 100px; min-height: 80vh; }
    
    /* Custom UI untuk Form Kontak */
    .contact-split { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-top: 40px; }
    .contact-info-block { margin-top: 40px; }
    .contact-label { font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 1px; color: var(--orange); margin-bottom: 5px; }
    .contact-value { font-size: 1.25rem; font-weight: 600; margin-bottom: 25px; }
    
    .contact-form-box { background: var(--white); border-radius: 24px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); }
    .form-group { margin-bottom: 20px; }
    .form-control { width: 100%; padding: 18px 20px; border: 2px solid #EEE; border-radius: 12px; font-family: var(--font-body); font-size: 1rem; transition: border-color 0.3s ease; }
    .form-control:focus { outline: none; border-color: var(--orange); }
    textarea.form-control { resize: vertical; min-height: 120px; }
    
    @media (max-width: 992px) {
      .contact-split { grid-template-columns: 1fr; }
      .contact-form-box { padding: 30px 20px; }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <nav class="nav">
    <div class="logo">
      <a href="index.html" class="r-mark" style="text-decoration: none; color: inherit;">V</a>
    </div>
    <button class="menu-btn">MENU +</button>
  </nav>

  <div class="page-wrapper mesh-bg">
      <div class="container contact-split">
        <!-- Bagian Kiri: Info -->
        <div>
          <h2 class="section-title massive">SAPA<br><span class="outline-text-dark" style="-webkit-text-stroke: 2px var(--black); color: transparent;">KAMI!</span></h2>
          <p class="body-text mt-2">Punya ide gila untuk website bisnismu? Atau butuh konsultasi paket mana yang cocok? Mari diskusikan bersama tim kami.</p>
          
          <div class="contact-info-block">
            <h4 class="contact-label">EMAIL</h4>
            <p class="contact-value">hello@vanguardweb.works</p>
            
            <h4 class="contact-label">WHATSAPP / TELEPON</h4>
            <p class="contact-value">+62 838 2913 2714</p>
            
            <h4 class="contact-label">KANTOR</h4>
            <p class="contact-value">Jl. Kreatif Digital No. 99<br>Jakarta Selatan, Indonesia</p>
          </div>
        </div>
        
        <!-- Bagian Kanan: Form -->
        <div class="contact-form-box">
          <form action="#" method="POST">
            <div class="form-group">
              <input type="text" class="form-control" placeholder="Nama Lengkap Kamu" required>
            </div>
            <div class="form-group">
              <input type="email" class="form-control" placeholder="Alamat Email" required>
            </div>
            <div class="form-group">
              <textarea class="form-control" placeholder="Ceritakan sedikit tentang kebutuhan website bisnismu..." required></textarea>
            </div>
            <button type="submit" class="btn btn-pill btn-dark" style="width: 100%; justify-content: center; border: none; background: var(--black); color: var(--white); cursor:pointer;">
              <span class="btn-text">KIRIM PESAN</span>
            </button>
          </form>
        </div>
      </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer dark-bg">
      <!-- (Gunakan kode footer yang sama) -->
  </footer>

  <div class="chat-btn"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z"/></svg></div>
  <script src="script.js"></script>
</body>
</html>
